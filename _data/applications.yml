# Data science applications running in the Arcade.
# Mirrors the "Data Science Applications" section of https://arcade.evl.uic.edu/
#
#   name:        display name of the application
#   url:         where the application lives
#   link_text:   how the URL is shown on the card (defaults to url)
#   thumb:       file in assets/img/apps/
#   description: one or two sentences
#   cite:        citation or credit line (optional)
#   cite_url:    link for the citation (optional)

- name: ConGAT
  url: https://arcade.evl.uic.edu/congat
  link_text: arcade.evl.uic.edu/congat
  thumb: congat-thumb.jpg
  description: >-
    Context-aware graph attention visual analysis for 3D region of interest
    discovery in multiplexed microscopy images, by Hossein Fathollahian et al.
  cite: >-
    H. Fathollahian et al, ConGAT: Context-Aware Graph Attention Visual Analysis
    for 3D Region of Interest Discovery in Multiplexed Microscopy Images,
    Computers & Graphics, 2026
  cite_url: https://www.sciencedirect.com/science/article/pii/S0097849326001998

- name: BioSET
  url: https://arcade.evl.uic.edu/bioset
  link_text: arcade.evl.uic.edu/bioset
  thumb: bioset-thumb.jpg
  description: >-
    Interactive visual analysis of biomarker co-localization in large
    multi-volume tissue data.
  cite: Chahat Kalsi, Hossein Fathollahian et al.

